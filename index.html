<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>RecipeBook - Мои десерты</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fdf5e6; color: #333; text-align: center; padding: 50px; }
        h1 { color: #d2691e; font-size: 3em; }
        .recipe-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 30px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 200px; }
    </style>
</head>
<body>
    <h1>🍰 Добро пожаловать в RecipeBook!</h1>
    <p>Здесь собраны лучшие десерты, которые мы готовили.</p>
    
    <div class="recipe-list">
        <div class="card"><h3>Тирамису</h3><p>Классический итальянский десерт</p></div>
        <div class="card"><h3>Крем-брюле</h3><p>Нежный французский десерт</p></div>
        <div class="card"><h3>Панна-котта</h3><p>Сливочное наслаждение</p></div>
    </div>
</body>
</html>
